[project]
name = "edgar-analyst"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "etibrewala" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.12.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "lancedb>=0.41.0",
    "lxml>=6.1.3",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "typer>=0.29.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
edgar-analyst = "edgar_analyst.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
